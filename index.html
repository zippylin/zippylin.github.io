<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3ec">
  <meta name="description" content="從成語與英文時態開始，選擇今天想學習的內容。">
  <title>一起學習｜成語與英文時態</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f3ec;
      --paper-deep: #eee6d9;
      --ink: #23333a;
      --muted: #687477;
      --line: #d8cec0;
      --teal: #176b67;
      --teal-deep: #0f4d4b;
      --coral: #dc765e;
      --gold: #d6a64f;
      --white: #fffdf9;
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 88% 8%, rgba(214, 166, 79, .16), transparent 28rem),
        radial-gradient(ellipse at 8% 83%, rgba(23, 107, 103, .09), transparent 30rem),
        var(--paper);
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      line-height: 1.7;
    }

    a { color: inherit; }
    .page { width: min(1080px, calc(100% - 48px)); margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; }
    .brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand-mark {
      display: grid;
      width: 42px;
      aspect-ratio: 1;
      place-items: center;
      border-radius: 50%;
      color: var(--white);
      background: var(--teal);
      box-shadow: 4px 4px 0 var(--gold);
      font-family: 'Noto Serif TC', 'PMingLiU', serif;
      font-size: 19px;
    }
    .brand-name { font-family: 'Noto Serif TC', 'PMingLiU', serif; font-size: 18px; font-weight: 800; letter-spacing: .08em; }

    main { padding: 0 0 24px; }
    .home-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 12px 0 16px; }
    .intro { min-width: 0; animation: rise .65s ease both; }
    .eyebrow { color: var(--coral); font-size: 12px; font-weight: 700; letter-spacing: .18em; }
    h1 {
      margin: 0 0 4px;
      font-family: 'Noto Serif TC', 'PMingLiU', serif;
      font-size: 26px;
      line-height: 1.2;
    }
    .intro p { margin: 0; color: var(--muted); font-size: 13px; }
    .visit-count { flex-shrink: 0; margin: 0; color: var(--muted); font-size: 12px; text-align: right; }
    .visit-count strong { color: var(--coral); font-variant-numeric: tabular-nums; }
    .milestone-message { position: fixed; z-index: 2; top: 22px; left: 50%; width: max-content; max-width: calc(100% - 32px); transform: translateX(-50%); padding: 12px 20px; border: 1px solid var(--gold); color: var(--ink); background: var(--white); box-shadow: 0 8px 30px rgba(35, 51, 58, .16); text-align: center; animation: rise .4s ease both; }
    .milestone-message[hidden] { display: none; }
    .fireworks { position: fixed; z-index: 1; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    .style-picker { display: flex; flex-shrink: 0; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0; }
    .style-picker-label { margin-right: 4px; color: var(--muted); font-size: 13px; font-weight: 700; }
    .style-button { padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); background: var(--white); font: inherit; font-size: 13px; cursor: pointer; }
    .style-button[aria-pressed="true"] { border-color: var(--teal); color: var(--white); background: var(--teal); }
    .style-button:focus-visible { outline: 3px solid rgba(23, 107, 103, .35); outline-offset: 2px; }
    .style-view[hidden] { display: none; }

    .choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .choice {
      position: relative;
      display: flex;
      min-height: 310px;
      flex-direction: column;
      overflow: hidden;
      padding: 26px 28px;
      border: 1px solid var(--line);
      color: var(--ink);
      background: rgba(255, 253, 249, .82);
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      animation: rise .65s ease both;
    }
    .choice:nth-child(2) { animation-delay: .12s; }
    .choice:nth-child(3) { animation-delay: .24s; }
    .choice:hover, .choice:focus-visible {
      transform: translateY(-4px);
      border-color: var(--teal);
      box-shadow: 0 16px 36px rgba(42, 48, 44, .11);
      outline: none;
    }
    .choice-idiom { border-top: 5px solid var(--coral); }
    .choice-english { border-top: 5px solid var(--teal); }
    .choice-guitar { border-top: 5px solid var(--gold); }
    .choice-label { color: var(--muted); font-size: 12px; letter-spacing: .12em; }
    .choice-art {
      display: grid;
      min-height: 116px;
      flex: 1;
      place-items: center;
      color: var(--teal-deep);
    }
    .idiom-art {
      font-family: 'Noto Serif TC', 'PMingLiU', serif;
      font-size: clamp(40px, 6vw, 58px);
      letter-spacing: .12em;
      text-shadow: 3px 3px 0 rgba(214, 166, 79, .45);
    }
    .tense-art {
      display: grid;
      width: min(190px, 80%);
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      transform: rotate(-4deg);
    }
    .tense-art span {
      display: grid;
      aspect-ratio: 1.25;
      place-items: center;
      border: 1px solid rgba(23, 107, 103, .32);
      color: var(--teal);
      background: rgba(23, 107, 103, .06);
      font-family: Georgia, serif;
      font-size: 18px;
      font-weight: 700;
    }
    .tense-art span:nth-child(2n) { color: var(--coral); background: rgba(220, 118, 94, .08); }
    .chord-art { color: var(--teal-deep); font-family: Georgia, serif; font-size: clamp(24px, 3vw, 34px); font-weight: 700; letter-spacing: .04em; }
    .choice-bottom { display: flex; align-items: end; justify-content: space-between; gap: 16px; }
    .choice h2 { margin: 0; color: var(--teal-deep); font-family: 'Noto Serif TC', 'PMingLiU', serif; font-size: 28px; }
    .choice-english h2 { color: var(--ink); }
    .choice p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
    .arrow { color: var(--coral); font-size: 26px; line-height: 1; transition: transform .2s ease; }
    .choice:hover .arrow { transform: translateX(4px); }

    .island-map {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #85d4e5;
      isolation: isolate;
    }
    .island-frame { display: block; width: 100%; height: calc(100svh - 160px); min-height: 360px; border: 0; }
    .island-map-image { position: absolute; z-index: -1; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .map-unit {
      position: absolute;
      top: var(--map-y);
      left: var(--map-x);
      display: flex;
      width: clamp(100px, 19%, 150px);
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255, 255, 255, .9);
      border-radius: 12px;
      color: var(--white);
      background: rgba(15, 77, 75, .94);
      box-shadow: 0 3px 10px rgba(25, 47, 42, .3);
      text-align: center;
      text-decoration: none;
    }
    a.map-unit { transition: transform .18s ease, box-shadow .18s ease; }
    a.map-unit:hover, a.map-unit:focus-visible { z-index: 1; transform: translate(-50%, -56%); box-shadow: 0 7px 16px rgba(25, 47, 42, .38); outline: 3px solid #fff0a1; outline-offset: 2px; }
    .map-unit-icon { display: grid; width: 28px; height: 28px; flex: 0 0 28px; place-items: center; border-radius: 50%; color: var(--teal-deep); background: #fff1a3; font-weight: 800; }
    .map-unit strong, .map-unit small { display: block; }
    .map-unit strong { font-size: 13px; line-height: 1.3; }
    .map-unit small { margin-top: 2px; color: rgba(255, 255, 255, .84); font-size: 10px; line-height: 1.25; }
    .map-unit-future {
      width: clamp(78px, 14%, 110px);
      min-height: 36px;
      gap: 4px;
      border: 1px dashed rgba(255, 255, 255, .95);
      color: #39453e;
      background: rgba(255, 250, 220, .9);
      box-shadow: 0 2px 7px rgba(25, 47, 42, .2);
    }
    .map-unit-future .map-unit-icon { width: 22px; height: 22px; flex-basis: 22px; color: var(--muted); background: #e4e2d5; font-size: 11px; }
    .map-unit-future strong { font-size: 11px; }
    .map-unit-future small { color: #687477; font-size: 9px; }
    .map-caption { margin: 12px 0 0; color: var(--muted); font-size: 13px; text-align: center; }

    footer { display: flex; justify-content: space-between; gap: 16px; padding: 20px 0 30px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }

    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 640px) {
      .page { width: min(100% - 32px, 480px); }
      header { padding: 10px 0; }
      .brand { gap: 8px; }
      .brand-mark { width: 34px; font-size: 17px; }
      .brand-name { font-size: 16px; }
      .visit-count { max-width: 140px; font-size: 11px; }
      .home-toolbar { flex-direction: column; align-items: flex-start; gap: 10px; padding: 8px 0 12px; }
      h1 { font-size: 22px; }
      .intro p { font-size: 12px; }
      .style-picker { gap: 6px; }
      .style-picker-label { font-size: 12px; }
      .style-button { padding: 6px 12px; font-size: 12px; }
      .island-frame { height: calc(100svh - 210px); }
      .choices { grid-template-columns: 1fr; gap: 14px; }
      .choice { min-height: 270px; padding: 22px; }
      .choice-art { min-height: 96px; }
      footer { flex-direction: column; gap: 2px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="page">
    <a class="brand" href="index.html" aria-label="一起學習首頁">
      <span class="brand-mark" aria-hidden="true">學</span>
      <span class="brand-name">一起學習</span>
    </a>
    <p class="visit-count" aria-live="polite">累計 <strong id="visit-count">…</strong> 人次開啟本頁</p>
  </header>

  <main>
    <div class="home-toolbar page">
    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title">今天想學什麼？</h1>
      <p>成語、英文時態、吉他和弦，每天學一點。</p>
    </section>

    <div class="style-picker" role="group" aria-label="選擇首頁風格">
      <span class="style-picker-label">首頁風格</span>
      <button class="style-button" type="button" data-style="cards" aria-pressed="false">Style 1 · 卡片</button>
      <button class="style-button" type="button" data-style="island" aria-pressed="true">Style 2 · 學習島</button>
    </div>
    </div>

    <nav class="choices style-view page" data-style-view="cards" aria-label="選擇學習主題" hidden>
      <a class="choice choice-idiom" href="4words_index.html">
        <span class="choice-label">中文 · 每日練習</span>
        <span class="choice-art idiom-art" aria-hidden="true">成語典故</span>
        <span class="choice-bottom">
          <span>
            <h2>四字成語</h2>
            <p>讀典故、看例句，也可以測驗配對。</p>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </span>
      </a>

      <a class="choice choice-english" href="English_tenses.html">
        <span class="choice-label">ENGLISH · GRAMMAR</span>
        <span class="choice-art" aria-hidden="true">
          <span class="tense-art"><span>12</span><span>T</span><span>V</span><span>is</span><span>ed</span><span>be</span></span>
        </span>
        <span class="choice-bottom">
          <span>
            <h2>英文時態</h2>
            <p>掌握英文 12 種基本時態與句型。</p>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </span>
      </a>

      <a class="choice choice-guitar" href="Guitar.html">
        <span class="choice-label">BEGINNER · GUITAR CHORDS</span>
        <span class="choice-art chord-art" aria-hidden="true">C · G · Am · F</span>
        <span class="choice-bottom">
          <span>
            <h2>吉他和弦</h2>
            <p>練習入門和弦指法、和弦進行與吉他譜。</p>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </span>
      </a>
    </nav>

    <section class="style-view" data-style-view="island" aria-label="學習島 3D 地圖，含三個開放單元與五個預留位置">
      <div class="island-map">
        <iframe class="island-frame" title="學習島互動 3D 地圖" src="reference-3d.html"></iframe>
      </div>
    </section>
  </main>

  <footer class="page">
    <span>留一點時間，給每天的學習。</span>
    <span>家人共用的學習小站</span>
  </footer>
  <div class="milestone-message" id="milestone-message" role="status" aria-live="polite" hidden></div>
  <canvas class="fireworks" id="fireworks" aria-hidden="true"></canvas>
  <script>
    const counterUrl = 'https://abacus.jasoncameron.dev/hit/zippylin.github.io/learning-home-visits';
    const countEl = document.getElementById('visit-count');

    document.querySelectorAll('.style-button').forEach((button) => {
      button.addEventListener('click', () => {
        const selectedStyle = button.dataset.style;
        document.querySelectorAll('.style-button').forEach((styleButton) => {
          styleButton.setAttribute('aria-pressed', String(styleButton === button));
        });
        document.querySelectorAll('[data-style-view]').forEach((view) => {
          view.hidden = view.dataset.styleView !== selectedStyle;
        });
      });
    });

    function celebrate(visitCount) {
      const message = document.getElementById('milestone-message');
      message.textContent = `🎉 恭喜！你是第 ${visitCount.toLocaleString('zh-Hant')} 位造訪者！`;
      message.hidden = false;

      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const canvas = document.getElementById('fireworks');
        const context = canvas.getContext('2d');
        const resize = () => {
          canvas.width = window.innerWidth * devicePixelRatio;
          canvas.height = window.innerHeight * devicePixelRatio;
          context.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        };
        const colors = ['#176b67', '#dc765e', '#d6a64f', '#0f4d4b'];
        const particles = Array.from({ length: 120 }, (_, index) => {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 5;
          return {
            x: window.innerWidth * (.2 + Math.random() * .6),
            y: window.innerHeight * (.15 + Math.random() * .45),
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: colors[index % colors.length],
            life: 55 + Math.random() * 35
          };
        });
        let frame = 0;
        resize();
        window.addEventListener('resize', resize, { once: true });
        const animate = () => {
          context.clearRect(0, 0, window.innerWidth, window.innerHeight);
          particles.forEach((particle) => {
            if (particle.life <= 0) return;
            particle.x += particle.vx;
            particle.y += particle.vy;
            particle.vy += .04;
            particle.life -= 1;
            context.globalAlpha = Math.min(1, particle.life / 15);
            context.fillStyle = particle.color;
            context.beginPath();
            context.arc(particle.x, particle.y, 3, 0, Math.PI * 2);
            context.fill();
          });
          context.globalAlpha = 1;
          frame += 1;
          if (frame < 90) requestAnimationFrame(animate);
          else canvas.hidden = true;
        };
        animate();
      }
    }

    fetch(counterUrl)
      .then((response) => response.json())
      .then(({ value }) => {
        countEl.textContent = Number(value).toLocaleString('zh-Hant');
        if (value > 0 && value % 1000 === 0) celebrate(value);
      })
      .catch(() => { countEl.textContent = '—'; });
  </script>
</body>
</html>
