<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3ec">
  <meta name="description" content="從成語與英文時態開始，選擇今天想學習的內容。">
  <title>一起學習｜成語與英文時態</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f3ec;
      --paper-deep: #eee6d9;
      --ink: #23333a;
      --muted: #687477;
      --line: #d8cec0;
      --teal: #176b67;
      --teal-deep: #0f4d4b;
      --coral: #dc765e;
      --gold: #d6a64f;
      --white: #fffdf9;
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 88% 8%, rgba(214, 166, 79, .16), transparent 28rem),
        radial-gradient(ellipse at 8% 83%, rgba(23, 107, 103, .09), transparent 30rem),
        var(--paper);
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      line-height: 1.7;
    }

    a { color: inherit; }
    .page { width: min(1080px, calc(100% - 48px)); margin: 0 auto; }
    header { padding: 30px 0; }
    .brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand-mark {
      display: grid;
      width: 42px;
      aspect-ratio: 1;
      place-items: center;
      border-radius: 50%;
      color: var(--white);
      background: var(--teal);
      box-shadow: 4px 4px 0 var(--gold);
      font-family: 'Noto Serif TC', 'PMingLiU', serif;
      font-size: 19px;
    }
    .brand-name { font-family: 'Noto Serif TC', 'PMingLiU', serif; font-size: 18px; font-weight: 800; letter-spacing: .08em; }

    main { padding: 48px 0 86px; }
    .intro { max-width: 680px; margin-bottom: 44px; animation: rise .65s ease both; }
    .eyebrow { color: var(--coral); font-size: 12px; font-weight: 700; letter-spacing: .18em; }
    h1 {
      margin: 10px 0 14px;
      font-family: 'Noto Serif TC', 'PMingLiU', serif;
      font-size: clamp(38px, 7vw, 68px);
      line-height: 1.2;
    }
    .intro p { max-width: 480px; margin: 0; color: var(--muted); font-size: 16px; }

    .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .choice {
      position: relative;
      display: flex;
      min-height: 310px;
      flex-direction: column;
      overflow: hidden;
      padding: 26px 28px;
      border: 1px solid var(--line);
      color: var(--ink);
      background: rgba(255, 253, 249, .82);
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      animation: rise .65s ease both;
    }
    .choice:nth-child(2) { animation-delay: .12s; }
    .choice:hover, .choice:focus-visible {
      transform: translateY(-4px);
      border-color: var(--teal);
      box-shadow: 0 16px 36px rgba(42, 48, 44, .11);
      outline: none;
    }
    .choice-idiom { border-top: 5px solid var(--coral); }
    .choice-english { border-top: 5px solid var(--teal); }
    .choice-label { color: var(--muted); font-size: 12px; letter-spacing: .12em; }
    .choice-art {
      display: grid;
      min-height: 116px;
      flex: 1;
      place-items: center;
      color: var(--teal-deep);
    }
    .idiom-art {
      font-family: 'Noto Serif TC', 'PMingLiU', serif;
      font-size: clamp(40px, 6vw, 58px);
      letter-spacing: .12em;
      text-shadow: 3px 3px 0 rgba(214, 166, 79, .45);
    }
    .tense-art {
      display: grid;
      width: min(190px, 80%);
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      transform: rotate(-4deg);
    }
    .tense-art span {
      display: grid;
      aspect-ratio: 1.25;
      place-items: center;
      border: 1px solid rgba(23, 107, 103, .32);
      color: var(--teal);
      background: rgba(23, 107, 103, .06);
      font-family: Georgia, serif;
      font-size: 18px;
      font-weight: 700;
    }
    .tense-art span:nth-child(2n) { color: var(--coral); background: rgba(220, 118, 94, .08); }
    .choice-bottom { display: flex; align-items: end; justify-content: space-between; gap: 16px; }
    .choice h2 { margin: 0; color: var(--teal-deep); font-family: 'Noto Serif TC', 'PMingLiU', serif; font-size: 28px; }
    .choice-english h2 { color: var(--ink); }
    .choice p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
    .arrow { color: var(--coral); font-size: 26px; line-height: 1; transition: transform .2s ease; }
    .choice:hover .arrow { transform: translateX(4px); }

    footer { display: flex; justify-content: space-between; gap: 16px; padding: 20px 0 30px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }

    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 640px) {
      .page { width: min(100% - 32px, 480px); }
      header { padding: 22px 0; }
      main { padding: 42px 0 58px; }
      .intro { margin-bottom: 30px; }
      .choices { grid-template-columns: 1fr; gap: 14px; }
      .choice { min-height: 270px; padding: 22px; }
      .choice-art { min-height: 96px; }
      footer { flex-direction: column; gap: 2px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="page">
    <a class="brand" href="index.html" aria-label="一起學習首頁">
      <span class="brand-mark" aria-hidden="true">學</span>
      <span class="brand-name">一起學習</span>
    </a>
  </header>

  <main class="page">
    <section class="intro" aria-labelledby="page-title">
      <div class="eyebrow">LEARN SOMETHING TODAY</div>
      <h1 id="page-title">今天想學什麼？</h1>
      <p>挑一個主題，從一點點開始。成語和英文時態都整理在這裡。</p>
    </section>

    <nav class="choices" aria-label="選擇學習主題">
      <a class="choice choice-idiom" href="4words_index.html">
        <span class="choice-label">中文 · 每日練習</span>
        <span class="choice-art idiom-art" aria-hidden="true">成語典故</span>
        <span class="choice-bottom">
          <span>
            <h2>四字成語</h2>
            <p>讀典故、看例句，也可以測驗配對。</p>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </span>
      </a>

      <a class="choice choice-english" href="English_tenses.html">
        <span class="choice-label">ENGLISH · GRAMMAR</span>
        <span class="choice-art" aria-hidden="true">
          <span class="tense-art"><span>12</span><span>T</span><span>V</span><span>is</span><span>ed</span><span>be</span></span>
        </span>
        <span class="choice-bottom">
          <span>
            <h2>英文時態</h2>
            <p>掌握英文 12 種基本時態與句型。</p>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </span>
      </a>
    </nav>
  </main>

  <footer class="page">
    <span>留一點時間，給每天的學習。</span>
    <span>家人共用的學習小站</span>
  </footer>
</body>
</html>
