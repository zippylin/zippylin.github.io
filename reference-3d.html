<style>

<body>
<main id="scene" aria-label="學習島互動立體地圖"></main>
<header><small>LEARNING ISLAND / 001</small><h1>學習島</h1><p>每天一點，探索新知。</p></header>
<div id="labels"></div>
<nav class="tools" aria-label="地圖工具">
<button class="tool" id="home" title="全島視角" aria-label="全島視角"><i data-lucide="house"></i></button>
<button class="tool" id="rotate" title="自動環繞" aria-label="自動環繞" aria-pressed="false"><i data-lucide="rotate-3d"></i></button>
<button class="tool" id="motion" title="啟用動畫" aria-label="啟用動畫" aria-pressed="false"><i data-lucide="activity"></i></button>
<button class="tool" id="image" title="原圖對照" aria-label="原圖對照" aria-pressed="false"><i data-lucide="image"></i></button>
<button class="tool" id="download" title="下載 GLB 模型 · 可匯入 Blender" aria-label="下載 GLB 模型"><i data-lucide="download"></i></button>
<button class="tool battery-indicator" id="battery-indicator" title="電池電量 100%，充電中" aria-label="電池電量 100%，充電中"><span class="battery-icon" aria-hidden="true"><span class="battery-segment" data-active="true"></span><span class="battery-segment" data-active="true"></span><span class="battery-segment" data-active="true"></span><span class="battery-segment" data-active="true"></span><span class="battery-segment" data-active="true"></span></span></button>
</nav>
<div class="time-controls" role="group" aria-label="島嶼時間">
<output id="island-time" aria-label="島嶼目前時間">12:00<small>中午</small></output>
<button class="tool" data-hour="6" title="清晨" aria-label="清晨" aria-pressed="false"><i data-lucide="sunrise"></i></button>
<button class="tool" data-hour="12" title="中午" aria-label="中午" aria-pressed="false"><i data-lucide="sun"></i></button>
<button class="tool" data-hour="18" title="傍晚" aria-label="傍晚" aria-pressed="false"><i data-lucide="sunset"></i></button>
<button class="tool" data-hour="0" title="夜晚" aria-label="夜晚" aria-pressed="false"><i data-lucide="moon"></i></button>
<button class="tool" id="time-auto" title="自動日夜循環" aria-label="自動日夜循環" aria-pressed="true"><i data-lucide="clock-3"></i></button>
<button class="tool" id="weather-toggle" title="切換天氣示範" aria-label="天氣：晴朗，按此開始下雨" aria-pressed="false"><i data-lucide="cloud-rain"></i></button>
<span class="weather-state" id="weather-state" role="status" aria-live="polite">晴朗</span>
</div>
<img id="reference" src="reference.png" alt="島嶼原始參考地圖" hidden>
<div class="compass" id="compass" role="img" aria-label="地圖指北針">
<div class="compass-dial">
<div class="compass-rose" id="compass-rose"><span class="north">北</span><span class="east">東</span><span class="south">南</span><span class="west">西</span><i data-lucide="navigation-2"></i></div>
<span class="compass-body compass-sun" id="compass-sun" title="太陽方位"><i data-lucide="sun"></i></span>
<span class="compass-body compass-moon" id="compass-moon" title="月亮方位"><i data-lucide="moon"></i></span>
</div><span class="compass-heading" id="compass-heading">000°</span>
</div>
<section class="panel" aria-label="學習單元"><h2>學習座標</h2><div class="places" id="places"></div></section>
<footer><strong>一座島，每天一點新發現</strong>一起學習 · LEARNING ISLAND</footer>
<div id="status" role="status">正在建構島嶼…</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js" onerror="document.getElementById('status').textContent='無法載入 3D 引擎，請確認網路連線後重新整理。'"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script>
(() => {
'use strict';
const status = document.getElementById('status');
if (!window.THREE || !THREE.OrbitControls) { status.textContent = '3D 引擎尚未載入，請確認網路連線後重新整理。'; return; }
if (window.lucide) lucide.createIcons();
const scene = new THREE.Scene();
scene.background = new THREE.Color('#85d4e5');
scene.fog = new THREE.Fog('#85d4e5', 220, 500);
const camera = new THREE.PerspectiveCamera(innerWidth<600?70:38, innerWidth / innerHeight, .1, 600);
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .85;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('scene').appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .065;
controls.minDistance = 13; controls.maxDistance = 160;
controls.maxPolarAngle = Math.PI * .47; controls.autoRotateSpeed = .5;
const island = new THREE.Group(); island.name = 'Learning Island'; scene.add(island);
const hemisphere=new THREE.HemisphereLight('#e5f6ff', '#60764b', .95);scene.add(hemisphere);
const sun = new THREE.DirectionalLight('#fff0d6', 1.15);
sun.position.set(-35,70,25); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left = -48; sun.shadow.camera.right = 48;
sun.shadow.camera.top = 48; sun.shadow.camera.bottom = -48; sun.shadow.camera.far = 150;
sun.shadow.bias = -.001; scene.add(sun);
const materials = {};
function material(color) { return materials[color] || (materials[color] = new THREE.MeshStandardMaterial({color:new THREE.Color(color).convertSRGBToLinear(),roughness:.88,flatShading:true})); }
const geometries = {
 box:new THREE.BoxGeometry(1,1,1), cone:new THREE.ConeGeometry(1,1,6),
 cylinder:new THREE.CylinderGeometry(1,1,1,8), sphere:new THREE.IcosahedronGeometry(1,0)
};
function mesh(kind,color,x,y,z,sx,sy,sz,parent=island) {
 const object = new THREE.Mesh(geometries[kind],material(color));
 object.position.set(x,y,z); object.scale.set(sx,sy,sz); object.castShadow = true; object.receiveShadow = true; parent.add(object); return object;
}
let seed = 321;
function random() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
function coast(angle) { return 1 + .055*Math.sin(angle*7) + .04*Math.cos(angle*11) + .025*Math.sin(angle*17); }
function inside(x,z,margin=0) { const angle = Math.atan2(z/32,x/30); return Math.hypot(x/30,z/32) < coast(angle)-margin; }
function hill(x,z,cx,cz,width,depth,height) { return height*Math.exp(-((x-cx)**2/width+(z-cz)**2/depth)); }
function height(x,z) {
 let value = 2.4 + .3*Math.sin(x*.45)*Math.cos(z*.32);
 value += hill(x,z,-4,-22,115,48,13) + hill(x,z,15,-15,43,70,10);
 value += hill(x,z,-20,-2,45,200,2.4);
 value -= hill(x,z,15,2,35,33,3.8);
 value -= hill(x,z,-13,15,22,32,2.1);
 value -= hill(x,z,1,27,110,24,1.8);
 return Math.max(.65,value);
}
const positions=[], colors=[];
const color = new THREE.Color();
function triangle(points,tint) { color.set(tint).convertSRGBToLinear(); for(const point of points){positions.push(...point);colors.push(color.r,color.g,color.b);} }
const step=1;
for(let x=-32;x<32;x+=step) for(let z=-34;z<34;z+=step) {
 if(!inside(x+.5,z+.5))continue;
 const corners=[[x,height(x,z),z],[x+step,height(x+step,z),z],[x+step,height(x+step,z+step),z+step],[x,height(x,z+step),z+step]];
 const elevation=height(x+.5,z+.5);
 const snowy=z < -13 && elevation>6.5;
 const shore=!inside(x+.5,z+.5,.065);
 const tint=snowy ? ['#f3f8f6','#dde9ed','#ffffff'][Math.floor(random()*3)] : shore && z>19 ? '#ecd99a' : ['#86ae50','#92b65a','#a1bd64','#7ba24a'][Math.floor(random()*4)];
 triangle([corners[0],corners[2],corners[1]],tint);triangle([corners[0],corners[3],corners[2]],tint);
 const edges=[[0,1,0,-1],[1,2,1,0],[2,3,0,1],[3,0,-1,0]];
 for(const [first,second,dx,dz] of edges) if(!inside(x+.5+dx,z+.5+dz)) {
  const topA=corners[first],topB=corners[second],baseA=[topA[0],-.9,topA[2]],baseB=[topB[0],-.9,topB[2]];
  const rock=['#8b9691','#a5aba0','#b9bca9','#768b89'][Math.floor(random()*4)];
  triangle([topA,topB,baseB],rock);triangle([topA,baseB,baseA],rock);
 }
}
const terrainGeometry=new THREE.BufferGeometry();terrainGeometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));terrainGeometry.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));terrainGeometry.computeVertexNormals();
const terrain=new THREE.Mesh(terrainGeometry,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,side:THREE.DoubleSide}));terrain.name='Faceted island terrain';terrain.castShadow=true;terrain.receiveShadow=true;island.add(terrain);
const sea=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),new THREE.MeshStandardMaterial({color:new THREE.Color('#3baec9').convertSRGBToLinear(),roughness:.42,metalness:.15}));sea.rotation.x=-Math.PI/2;sea.position.y=-.55;sea.receiveShadow=true;scene.add(sea);
function ribbon(points,width,tint,lift=.06,fixedHeight=null) {
 const curve=new THREE.CatmullRomCurve3(points.map(([x,z])=>new THREE.Vector3(x,0,z)));
 const vertices=[];
 for(let index=0;index<=160;index++){
  const point=curve.getPoint(index/160),tangent=curve.getTangent(index/160);
  const normal=new THREE.Vector3(-tangent.z,0,tangent.x).normalize().multiplyScalar(width/2);
  for(const direction of [-1,1]){const x=point.x+normal.x*direction,z=point.z+normal.z*direction;vertices.push(x,fixedHeight===null?height(x,z)+lift:fixedHeight,z);}
 }
 const indices=[];for(let index=0;index<160;index++){const start=index*2;indices.push(start,start+2,start+1,start+1,start+2,start+3);}
 const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));geometry.setIndex(indices);geometry.computeVertexNormals();
 const object=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({color:new THREE.Color(tint).convertSRGBToLinear(),roughness:.8,side:THREE.DoubleSide}));object.receiveShadow=true;island.add(object);return object;
}
const solarLights=[];
const solarBattery={charge:100,mode:'充電中'};
const batteryButton=document.getElementById('battery-indicator');
const batterySegments=[...batteryButton.querySelectorAll('.battery-segment')];
let lastBatteryLabel='';
const lampGlowCanvas=document.createElement('canvas');lampGlowCanvas.width=lampGlowCanvas.height=128;
const lampGlowContext=lampGlowCanvas.getContext('2d');
const lampGradient=lampGlowContext.createRadialGradient(64,64,0,64,64,64);
lampGradient.addColorStop(0,'rgba(255,239,181,1)');
lampGradient.addColorStop(.3,'rgba(255,219,137,.55)');
lampGradient.addColorStop(1,'rgba(255,206,113,0)');
lampGlowContext.fillStyle=lampGradient;lampGlowContext.fillRect(0,0,128,128);
const lampGlowTexture=new THREE.CanvasTexture(lampGlowCanvas);lampGlowTexture.encoding=THREE.sRGBEncoding;
function addRoadLights(points,spacing=8){
 const curve=new THREE.CatmullRomCurve3(points.map(([x,z])=>new THREE.Vector3(x,0,z)));
 const length=curve.getLength();
 for(let distance=spacing/2;distance<length;distance+=spacing){
  const point=curve.getPointAt(distance/length),ground=height(point.x,point.z);
  const group=new THREE.Group();group.name='Solar road light';group.position.set(point.x,ground,point.z);island.add(group);
  const side=Math.round(distance/spacing)%2?1:-1;
  mesh('cylinder','#3d5b50',0,1.55,0,.055,3.1,.055,group);
  mesh('box','#3d5b50',side*.35,2.95,0,.8,.07,.07,group);
  mesh('box','#45645a',side*.68,2.84,0,.45,.16,.34,group);
  const bulbMaterial=new THREE.MeshStandardMaterial({color:'#ffe6a4',emissive:'#ffca65',emissiveIntensity:0,roughness:.45});
  const bulb=new THREE.Mesh(geometries.sphere,bulbMaterial);bulb.position.set(side*.68,2.73,0);bulb.scale.set(.12,.08,.12);group.add(bulb);
  const light=new THREE.SpotLight('#ffdf9a',0,8,.62,.75,1.5);light.position.copy(bulb.position);group.add(light);
  light.target.position.set(side*.68,.08,0);group.add(light.target);
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:lampGlowTexture,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false}));
  glow.name='Streetlamp bulb halo';glow.position.copy(bulb.position);glow.scale.set(.75,.75,1);glow.visible=false;group.add(glow);
  const beamGeometry=new THREE.CylinderGeometry(.035,1.6,2.65,32,1,true);
  const beam=new THREE.Mesh(beamGeometry,new THREE.ShaderMaterial({
   transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,
   vertexShader:'varying vec2 beamUv; void main(){beamUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
   fragmentShader:'varying vec2 beamUv; void main(){float fade=sin(beamUv.y*3.14159265); gl_FragColor=vec4(1.0,0.82,0.46,fade*0.055);}'
  }));
  beam.name='Streetlamp downward beam';beam.position.set(side*.68,1.405,0);beam.visible=false;group.add(beam);
  const poolGeometry=new THREE.CircleGeometry(1.65,32);poolGeometry.rotateX(-Math.PI/2);
  const poolVertices=poolGeometry.attributes.position;
  for(let index=0;index<poolVertices.count;index++){
   const offsetX=side*.68+poolVertices.getX(index),offsetZ=poolVertices.getZ(index);
   poolVertices.setY(index,height(point.x+offsetX,point.z+offsetZ)-ground+.11);
  }
  poolGeometry.computeVertexNormals();
  const pool=new THREE.Mesh(poolGeometry,new THREE.MeshBasicMaterial({map:lampGlowTexture,transparent:true,opacity:.5,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,toneMapped:false}));
  pool.name='Streetlamp road light pool';pool.position.x=side*.68;pool.visible=false;group.add(pool);
  solarLights.push({bulb,light,glow,beam,pool});
 }
}
function road(points,width){ribbon(points,width,'#e4ca8b');addRoadLights(points);}
const lake=mesh('cylinder','#2cb3d3',15,1.55,2,6.9,.12,5.6);lake.name='Moonlight Lake';
mesh('cylinder','#35b6d2',-13,1.15,15,4,.1,4.7);
ribbon([[-12,-11],[-12,-5],[-8,1],[-9,9],[-13,15],[-12,23],[-16,29]],1.3,'#40bddd',.08);

let flight=null;
function home(){const mobile=innerWidth<600;flight={from:camera.position.clone(),to:new THREE.Vector3(55,mobile?100:75,mobile?115:88),targetFrom:controls.target.clone(),targetTo:new THREE.Vector3(0,2,mobile?5:1),start:performance.now()};document.querySelectorAll('.places button').forEach(button=>button.setAttribute('aria-pressed','false'));}
function focus(place){controls.autoRotate=false;document.getElementById('rotate').setAttribute('aria-pressed','false');const target=new THREE.Vector3(place.x,height(place.x,place.z),place.z);flight={from:camera.position.clone(),to:target.clone().add(new THREE.Vector3(17,21,26)),targetFrom:controls.target.clone(),targetTo:target,start:performance.now()};document.querySelectorAll('.places button').forEach(button=>button.setAttribute('aria-pressed',String(button.textContent===place.name)));}
for(const place of landmarks){
 const button=document.createElement(place.href?'a':'button');button.innerHTML='<span class="dot" style="--dot:'+place.color+'"></span>'+place.name;
 const label=document.createElement(place.href?'a':'button');label.className='label';label.textContent=place.name;label.style.borderBottomColor=place.color;
 for(const element of [button,label]){
  if(place.href){element.href=place.href;element.target='_top';}
  else{element.setAttribute('aria-label',place.name+'，尚未開放');element.dataset.reserved='true';element.setAttribute('aria-pressed','false');element.onclick=()=>focus(place);}
 }
 document.getElementById('places').appendChild(button);document.getElementById('labels').appendChild(label);place.label=label;
}
camera.position.set(55,innerWidth<600?100:75,innerWidth<600?115:88);controls.target.set(0,2,innerWidth<600?5:1);controls.update();
document.getElementById('home').onclick=home;
document.getElementById('rotate').onclick=event=>{controls.autoRotate=!controls.autoRotate;event.currentTarget.setAttribute('aria-pressed',String(controls.autoRotate));};
document.getElementById('image').onclick=event=>{const reference=document.getElementById('reference');reference.hidden=!reference.hidden;event.currentTarget.setAttribute('aria-pressed',String(!reference.hidden));};
document.getElementById('download').onclick=()=>{
 if(!THREE.GLTFExporter){status.textContent='匯出工具尚未載入，請確認網路連線。';return;}
 const button=document.getElementById('download');button.disabled=true;status.textContent='正在匯出 GLB 模型…';
 requestAnimationFrame(()=>{try{new THREE.GLTFExporter().parse(island,result=>{const blob=new Blob([result],{type:'model/gltf-binary'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='star-island.glb';link.click();setTimeout(()=>URL.revokeObjectURL(url),10000);status.textContent='已匯出 star-island.glb，可在 Blender 匯入。';button.disabled=false;},{binary:true});}catch(error){status.textContent='匯出失敗：'+error.message;button.disabled=false;}});
};
controls.addEventListener('start',()=>{flight=null;});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<600?70:38;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const projected=new THREE.Vector3();let lastTime=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const delta=Math.max(0,Math.min((now-lastTime)/1000,.1));lastTime=now;blades.rotation.z-=delta*.38;
 if(motionEnabled){
  if(weather.phase==='sunny'){
   updateSchoolTrip(delta);
   weather.nextChange-=delta;
   if(weather.nextChange<=0)startRain();
  }else updateWeather(delta);
 }
 if(flight){const progress=Math.min((now-flight.start)/950,1),ease=1-(1-progress)**3;camera.position.lerpVectors(flight.from,flight.to,ease);controls.target.lerpVectors(flight.targetFrom,flight.targetTo,ease);if(progress===1)flight=null;}
 controls.update();
 updateEnvironment(motionEnabled?delta:0);
 updateWeatherVisuals(motionEnabled?delta:0);
 for(const place of landmarks){projected.set(place.x,height(place.x,place.z)+3,place.z).project(camera);place.label.style.left=(projected.x*.5+.5)*innerWidth+'px';place.label.style.top=(-projected.y*.5+.5)*innerHeight+'px';place.label.hidden=projected.z>1||projected.z< -1;}
 renderer.render(scene,camera);
}
status.textContent='';requestAnimationFrame(animate);
window.islandApp={scene,camera,renderer,controls,island,landmarks,schoolTrip,phaseDurations,environment,weather,shelters,solarBattery,solarLights,solarStation};
})();
</script>
</body>
</html>
